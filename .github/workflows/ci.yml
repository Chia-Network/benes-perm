name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            bin_dir: build
            exe_suffix: ""
            # Hosted macOS runners use a virtual GPU that cannot create Metal
            # compute pipelines, so tests run against the portable path. The
            # Metal backend still gets a compile-only build below.
            cmake_args: "-DBENES_ENABLE_METAL=OFF"
          - name: Windows x64
            os: windows-2022
            bin_dir: build/Release
            exe_suffix: ".exe"
            cmake_args: "-A x64"
          - name: Ubuntu x64
            os: ubuntu-24.04
            bin_dir: build
            exe_suffix: ""
            cmake_args: ""
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            bin_dir: build
            exe_suffix: ""
            cmake_args: ""

    steps:
      - uses: actions/checkout@v5

      - name: Report runner CPU
        shell: bash
        run: |
          {
            echo "### Runner CPU (${{ matrix.name }})"
            echo '```'
            echo "runner: $RUNNER_OS / $RUNNER_ARCH"
            case "$RUNNER_OS" in
              Linux)
                lscpu | grep -E '^(Architecture|Model name|CPU\(s\)|Thread|Core|Socket)' || true
                ;;
              macOS)
                sysctl -n machdep.cpu.brand_string || true
                echo "model: $(sysctl -n hw.model), arch: $(uname -m), logical cores: $(sysctl -n hw.ncpu)"
                ;;
              Windows)
                powershell -NoProfile -Command \
                  'Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List'
                ;;
            esac
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build Metal backend (compile-only)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-metal \
            -DCMAKE_BUILD_TYPE=Release -DBENES_ENABLE_METAL=ON \
            -DBENES_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF
          cmake --build build-metal --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run extended tests
        shell: bash
        run: ./${{ matrix.bin_dir }}/benes-tests${{ matrix.exe_suffix }} --extended

      - name: Quick benchmarks
        shell: bash
        run: |
          bench=./${{ matrix.bin_dir }}/benes-benchmark${{ matrix.exe_suffix }}
          {
            echo "### Quick benchmarks (${{ matrix.name }})"
            echo '```'
            echo "portable CPU, 64 Ki entries, 1 thread"
            "$bench" cpu 65536 1 3
            echo "portable CPU, 1 Mi entries, 1 thread"
            "$bench" cpu 1048576 1 3
            echo "automatic backend, 1 Mi entries, 1 thread"
            "$bench" auto 1048576 1 3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
